stages:
  - cache
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

warm-cache:
  stage: cache
  image: python:3.12-slim
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip
    policy: pull-push
  script:
    - |
      if [ -d .cache/pip/wheels ] && [ "$(find .cache/pip/wheels -type f | wc -l)" -gt 0 ]; then
        echo "Python dependency cache already exists for this pyproject.toml key."
      else
        echo "Python dependency cache missing. Downloading wheels."
        python -m pip install --upgrade pip
        python -m pip download ".[dev]" --dest .cache/pip/wheels
      fi

test:
  stage: test
  image: python:3.12-slim
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip
    policy: pull
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install --find-links .cache/pip/wheels ".[dev]"
  script:
    - python -m pytest

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - test
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$DOCKER_IMAGE_TAG" .
    - docker push "$DOCKER_IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$DOCKER_IMAGE_TAG" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
